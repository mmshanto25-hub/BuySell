name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.12.3'

jobs:
  # ── Lint & Type Check ──────────────────────────
  lint-and-typecheck:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @marketplace/types build
          pnpm --filter @marketplace/utils build
          pnpm --filter @marketplace/validators build
          pnpm --filter @marketplace/ui build

      - name: TypeScript check — API
        run: pnpm --filter @marketplace/api typecheck

      - name: TypeScript check — Storefront
        run: pnpm --filter @marketplace/storefront typecheck
        continue-on-error: true

  # ── Unit & Integration Tests ───────────────────
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @marketplace/types build
          pnpm --filter @marketplace/utils build
          pnpm --filter @marketplace/validators build

      - name: Run test suites
        run: |
          npx tsx --test \
            apps/api/src/modules/auth/auth.service.test.ts \
            apps/api/src/modules/catalog/catalog.service.test.ts \
            apps/api/src/modules/orders/order.service.test.ts \
            apps/api/src/modules/payments/payment.service.test.ts \
            apps/api/src/modules/logistics/logistics.service.test.ts \
            apps/api/src/modules/returns/return.service.test.ts \
            apps/api/src/modules/finance/finance.service.test.ts \
            apps/api/src/modules/finance/finance.api.test.ts \
            apps/api/src/modules/ai/ai.service.test.ts \
            apps/api/src/modules/ai/ai.api.test.ts \
            apps/api/src/modules/qa/e2e-buyer-journey.test.ts \
            apps/api/src/modules/qa/e2e-seller-journey.test.ts \
            apps/api/src/modules/qa/e2e-admin-journey.test.ts \
            apps/api/src/modules/qa/security-audit.test.ts

  # ── Build ──────────────────────────────────────
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/api/dist/
            apps/storefront/.next/
          retention-days: 7

  # ── Security Audit ─────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # ── Docker Build (main branch only) ────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [unit-tests, build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: marketplace-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Storefront image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/storefront.Dockerfile
          push: false
          tags: marketplace-storefront:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
